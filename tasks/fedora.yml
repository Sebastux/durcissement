---
- name: Import des variables de la distribution.
  ansible.builtin.include_vars:
    file: defaults/fedora.yml

- name: Activation d'auditd.
  ansible.builtin.systemd_service:
    name: auditd
    state: started
    enabled: true

- name: Désactivation de services.
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - bluetooth
    - lvm2-monitor
    - lvm2-lvmpolld.socket
    - mdmonitor
    - raid-check.timer
    - cups
    - postfix
    - sssd
    - selinux-autorelabel-mark
    - kdump
    - dnf-makecache.timer
  ignore_errors: true

- name: Configuration de firewall.
  ansible.posix.firewalld:
    service: "{{ item.service }}"
    permanent: true
    state: "{{ item.etat }}"
    immediate: true
  loop:
    - {service: 'http', etat: 'disabled'}
    - {service: 'https', etat: 'disabled'}
    - {service: 'ftp', etat: 'disabled'}
    - {service: 'ssh', etat: 'enabled'}
    - {service: 'ntp', etat: 'enabled'}

- name: S'assurer que les fichiers et dossiers ont les bonnes permissions.
  ansible.builtin.file:
    path: "{{ item.chemin }}"
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    - {chemin: /etc/at.deny, mode: '0600'}
    - {chemin: /etc/cron.deny, mode: '0600'}
    - {chemin: /etc/crontab, mode: '0600'}
    - {chemin: /etc/cron.d, mode: '0700'}
    - {chemin: /etc/cron.daily, mode: '0700'}
    - {chemin: /etc/cron.hourly, mode: '0700'}
    - {chemin: /etc/cron.weekly, mode: '0700'}
    - {chemin: /etc/cron.monthly, mode: '0700'}
    - {chemin: /etc/shadow, mode: '0600'}
    - {chemin: /etc/gshadow, mode: '0600'}
    - {chemin: /etc/passwd, mode: '0644'}
    - {chemin: /etc/group, mode: '0644'}
    - {chemin: /etc/sudoers, mode: '0440'}
    - {chemin: /etc/sudoers.d, mode: '0750'}
    - {chemin: /etc/ssh/sshd_config, mode: '0600'}
    - {chemin: /etc/ssh/sshd_config.d, mode: '0750'}
    - {chemin: /root, mode: '0700'}
    - {chemin: /usr/bin/as, mode: '700'}
    - {chemin: /usr/bin/ccache, mode: '700'}
    - {chemin: /bin/su, mode: '700'}

- name: Désactivation de l'IPV6.
  ansible.builtin.template:
    src: disableipv6.j2
    dest: /etc/sysctl.d/99-disable-ipv6.conf
    backup: no
    owner: root
    group: root
    mode: '0644'

- name: Durcissement des paramètres réseau.
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
  loop:
    - {key: "net.core.bpf_jit_harden", value: "2"}
    - {key: "net.ipv4.conf.all.accept_redirects", value: "0"}
    - {key: "net.ipv4.conf.all.log_martians", value: "1"}
    - {key: "net.ipv4.conf.all.rp_filter", value: "1"}
    - {key: "net.ipv4.conf.all.send_redirects", value: "0"}
    - {key: "net.ipv4.conf.default.accept_redirects", value: "0"}
    - {key: "net.ipv4.conf.default.log_martians", value: "1"}

- name: Ajout de la résolution du nom.
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^{{ ansible_default_ipv4.address | regex_escape }}'
    line: "{{ ansible_default_ipv4.address }} {{ ansible_fqdn }} {{ ansible_hostname }}"
    state: present
    create: true
    insertafter: "^127\\.0\\.0\\.1.*"

- name: Redémarrage du serveur.
  ansible.builtin.reboot:
    msg: "Redémarrage automatique du serveur par ansible."
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: uptime
