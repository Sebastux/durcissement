---
- name: Import des variables de la distribution.
  ansible.builtin.include_vars:
    file: defaults/fedora.yml

- name: Configuration de dnf5.
  ansible.builtin.import_tasks:
    file: fedora/dnf5.yml

- name: Gestion de QEMU.
  ansible.builtin.import_tasks:
    file: fedora/qemu.yml

- name: Configuration du SSH.
  ansible.builtin.import_tasks:
    file: fedora/ssh.yml

# - name: Configuration du SSH 2Fa.
#   ansible.builtin.import_tasks:
#     file: fedora/ssh2fa.yml

- name: Durcissement des paramètres réseau.
  ansible.builtin.import_tasks:
    file: fedora/reseau.yml

- name: Gestion des droits sur les fichiers.
  ansible.builtin.import_tasks:
    file: fedora/permissions.yml

- name: Configuration de l'horloge.
  ansible.builtin.import_tasks:
    file: fedora/temps.yml

- name: Désactivation des services inutiles.
  ansible.builtin.import_tasks:
    file: fedora/services.yml

- name: Désactivation des modules inutiles.
  ansible.builtin.import_tasks:
    file: fedora/modprobe.yml

- name: Configuration de PAM.
  ansible.builtin.import_tasks:
    file: fedora/pam.yml

- name: Configuration de login.def.
  ansible.builtin.import_tasks:
    file: fedora/login_def.yml

- name: Configuration de `/etc/profile`.
  ansible.builtin.import_tasks:
    file: fedora/profile.yml

- name: Installation / configuration de fail2ban.
  ansible.builtin.import_tasks:
    file: fedora/fail2ban.yml

- name: Configuration de sudo.
  ansible.builtin.import_tasks:
    file: fedora/sudo.yml

- name: Redémarrage du serveur.
  ansible.builtin.reboot:
    msg: "Redémarrage automatique du serveur par ansible."
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: uptime
