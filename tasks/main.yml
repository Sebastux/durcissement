---
- name: Affichage de la distrib.
  ansible.builtin.debug:
    msg:
      - "Nom de la distribution              : {{ ansible_distribution }}."
      - "Version majeure de la distribution  : {{ ansible_distribution_major_version }}."
      - "Version mmineure de la distribution : {{ ansible_distribution_version }}."
      - "Architecture                        : {{ ansible_machine }}."

- name: "Durcissement d'une machine fedora {{ ansible_distribution_major_version }}."
  ansible.builtin.import_tasks:
    file: fedora.yml
  when: ansible_distribution == "Fedora"

- name: "Durcissement d'une machine AlmaLinux 9."
  ansible.builtin.import_tasks:
    file: almalinux9.yml
  when:
    - foundmatch: ansible_distribution is search("AlmaLinux")
    - alsomatch: ansible_distribution_major_version is search("9")

- name: "Durcissement d'une machine AlmaLinux 10."
  ansible.builtin.import_tasks:
    file: almalinux10.yml
  when:
    - foundmatch: ansible_distribution is search("AlmaLinux")
    - alsomatch: ansible_distribution_major_version is search("10")
